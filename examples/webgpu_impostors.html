<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - impostors</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - impostors">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_impostors.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_impostors.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
		<style>
			.label {
				color: #fff;
				font: 11px sans-serif;
				padding: 2px 6px;
				text-align: center;
				border-radius: 4px;
				background: rgba( 0, 0, 0, 0.5 );
			}
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Impostors</span>
			</div>

			<small>
				<a href="https://github.com/richardmonette/three-impostor" target="_blank" rel="noopener">three-impostor</a>. Each dragon is a LOD: the mesh up close, then a box impostor, then an octahedral impostor. Try 400 dragons with LOD on and off.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/",
					"three-impostor": "https://cdn.jsdelivr.net/npm/three-impostor@0.3.0/Impostor.js"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
			import { ImpostorBaker, ImpostorNodeMaterial } from 'three-impostor';

			let camera, scene, renderer, labelRenderer, controls;

			const levels = [];
			const dragons = [];

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 400 );
				camera.position.set( - 11, 9, 8 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x2b3a4a );
				scene.add( new THREE.HemisphereLight( 0xffffff, 0x2b3a4a, 2 ) );

				const light = new THREE.DirectionalLight( 0xffffff, 3 );
				light.position.set( 1, 2, 3 );
				scene.add( light );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( render );
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				labelRenderer = new CSS2DRenderer();
				labelRenderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.domElement.style.position = 'absolute';
				labelRenderer.domElement.style.top = '0px';
				labelRenderer.domElement.style.pointerEvents = 'none';
				document.body.appendChild( labelRenderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 1.5, 0, - 11.5 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				// mesh

				const gltf = await new GLTFLoader().loadAsync( 'models/gltf/DragonAttenuation.glb' );

				const dragon = gltf.scene.getObjectByName( 'Dragon' );
				dragon.material = new THREE.MeshStandardNodeMaterial( { color: 0xeba310, roughness: 0.5 } );

				const bounds = new THREE.Box3().setFromBufferAttribute( dragon.geometry.attributes.position );
				bounds.applyMatrix4( new THREE.Matrix4().compose( new THREE.Vector3(), dragon.quaternion, dragon.scale ) );
				const top = bounds.getCenter( new THREE.Vector3() ).setY( bounds.max.y + 0.2 );

				// impostors, baked once and shared by every dragon

				const baker = new ImpostorBaker( renderer );

				const params = { count: 5, boxResolution: 256, octahedralResolution: 256, frames: 12, lod: true, wireframe: false };

				levels.push(
					{ name: 'mesh', mesh: dragon, distance: 0 },
					{ name: 'box', mesh: new THREE.Mesh(), distance: 18.5 },
					{ name: 'octahedral', mesh: new THREE.Mesh(), distance: 31 }
				);

				async function bake( index, options ) {

					const data = await baker.bake( dragon, options );
					const level = levels[ index ];

					if ( level.mesh.material.impostor ) {

						level.mesh.material.impostor.dispose();
						level.mesh.material.dispose();
						level.wireframe.dispose();

					}

					level.mesh.geometry = data.geometry;
					level.mesh.material = new ImpostorNodeMaterial( data, { roughness: 0.5 } );
					level.wireframe = new THREE.WireframeGeometry( data.geometry );

					for ( const { lod } of dragons ) {

						const object = lod.levels[ index ].object;
						object.geometry = level.mesh.geometry;
						object.material = level.mesh.material;
						object.children[ 0 ].geometry = level.wireframe;

					}

				}

				const bakeBox = () => bake( 1, { resolution: params.boxResolution } );
				const bakeOctahedral = () => bake( 2, { layout: 'octahedral', resolution: params.octahedralResolution, frames: params.frames } );

				await bakeBox();
				await bakeOctahedral();

				const wireframeMaterial = new THREE.LineBasicNodeMaterial();

				function setLOD( value ) {

					for ( const { lod } of dragons ) {

						lod.autoUpdate = value;

						if ( value === false ) lod.levels.forEach( ( level, i ) => level.object.visible = i === 0 );

					}

				}

				// five dragons in a row, or a grid of them, each switching level with its distance to the camera

				function placeDragons() {

					for ( const { lod, label } of dragons ) {

						scene.remove( lod );
						if ( label ) scene.remove( label );

					}

					dragons.length = 0;

					const row = params.count === 5;
					const side = Math.ceil( Math.sqrt( params.count ) );

					for ( let i = 0; i < params.count; i ++ ) {

						const lod = new THREE.LOD();
						lod.quaternion.copy( dragon.quaternion );
						lod.scale.copy( dragon.scale );

						if ( row ) {

							lod.position.set( 0, 0, - i * 8 );

						} else {

							lod.position.set( ( i % side - ( side - 1 ) / 2 ) * 6, 0, - Math.floor( i / side ) * 6 );

						}

						for ( const { mesh, distance, wireframe } of levels ) {

							const object = new THREE.Mesh( mesh.geometry, mesh.material );
							lod.addLevel( object, distance, 0.05 );

							if ( wireframe === undefined ) continue;

							const lines = new THREE.LineSegments( wireframe, wireframeMaterial );
							lines.visible = params.wireframe;
							object.add( lines );

						}

						scene.add( lod );

						let label = null, element = null;

						if ( row ) {

							element = document.createElement( 'div' );
							element.className = 'label';

							label = new CSS2DObject( element );
							label.center.set( 0.5, 1 );
							label.position.copy( lod.position ).add( top );
							scene.add( label );

						}

						dragons.push( { lod, label, element, level: - 1 } );

					}

					setLOD( params.lod );

					if ( row ) {

						camera.position.set( - 11, 9, 8 );
						controls.target.set( 1.5, 0, - 11.5 );

					} else {

						controls.target.set( 0, 0, - ( side - 1 ) * 3 );
						camera.position.set( - 1, 1, 1 ).setLength( side * 6 ).add( controls.target );

					}

					controls.update();

				}

				placeDragons();

				// gui

				const gui = renderer.inspector.createParameters( 'Settings' );

				gui.add( params, 'count', [ 5, 100, 400 ] ).name( 'dragons' ).onChange( placeDragons );
				gui.add( params, 'boxResolution', [ 128, 256, 512 ] ).name( 'box resolution' ).onChange( bakeBox );
				gui.add( params, 'octahedralResolution', [ 64, 128, 256 ] ).name( 'octahedral resolution' ).onChange( bakeOctahedral );
				gui.add( params, 'frames', [ 8, 12, 16 ] ).name( 'octahedral frames' ).onChange( bakeOctahedral );
				gui.add( params, 'lod' ).name( 'LOD' ).onChange( setLOD );

				gui.add( params, 'wireframe' ).onChange( ( value ) => {

					dragon.material.wireframe = value;
					dragon.material.needsUpdate = true;

					for ( const { lod } of dragons ) {

						for ( const level of lod.levels.slice( 1 ) ) level.object.children[ 0 ].visible = value;

					}

				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );
				labelRenderer.setSize( window.innerWidth, window.innerHeight );

			}

			function render() {

				renderer.render( scene, camera );

				// label each dragon with the level it is showing

				for ( const dragon of dragons ) {

					if ( dragon.element === null ) continue;

					const level = dragon.lod.levels.findIndex( ( level ) => level.object.visible );

					if ( level !== dragon.level ) {

						const { name, mesh } = levels[ level ];
						const triangles = mesh.geometry.index ? mesh.geometry.index.count / 3 : mesh.geometry.attributes.position.count / 3;

						dragon.level = level;
						dragon.element.innerHTML = `${ name }<br>${ triangles.toLocaleString( 'en-US' ) } triangles`;

					}

				}

				labelRenderer.render( scene, camera );

			}

		</script>

	</body>
</html>
